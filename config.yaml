terminal:
  backend: docker
  home_mode: profile
  timeout: 180
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env: []
  docker_env: {}
  docker_volumes: []
  # per-session 容器隔离：每个会话容器只挂载该会话注册的 cwd（per-user workspace），
  # 绕开进程级 TERMINAL_CWD 单例。与宿主 /root/.hermes/.env 的
  # TERMINAL_CONTAINER_PERSISTENT / TERMINAL_DOCKER_MOUNT_CWD_TO_WORKSPACE 必须一致
  # （.env 经 systemd EnvironmentFile 在进程启动时注入，先于 config bridge）。
  docker_mount_cwd_to_workspace: true
  docker_network: true
  cwd: /home/hermes/personal-assistance-v2/workspaces
  docker_extra_args: []
  docker_run_as_host_user: false
  container_cpu: 1
  container_memory: 2048
  container_disk: 10240
  container_persistent: false
  docker_persist_across_processes: false
  docker_orphan_reaper: true
  lifetime_seconds: 300

security:
  redact_secrets: true
  tirith_enabled: true

approvals:
  mode: smart

agent:
  max_turns: 90
  tool_use_enforcement: true
  disabled_toolsets:
    - session_search
    - clarify

memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false

skills:
  write_approval: false

curator:
  enabled: true

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20

checkpoints:
  enabled: true
  max_snapshots: 10

plugins:
  enabled:
    - soul-manage
  disabled: []

platform_toolsets:
  api_server:
    - browser
    - code_execution
    - file
    - image_gen
    - memory
    - no_mcp
    - skills
    - soul
    - terminal
    - todo
    - vision
    - web
